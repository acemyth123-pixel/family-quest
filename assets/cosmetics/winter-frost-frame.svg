<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="none">
<defs>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effcff"/><stop offset=".35" stop-color="#9de7ff"/><stop offset=".7" stop-color="#55bde8"/><stop offset="1" stop-color="#dff8ff"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b322f"/><stop offset=".5" stop-color="#211c1c"/><stop offset="1" stop-color="#4e4039"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00111f" flood-opacity=".8"/></filter>
</defs>
