<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Quest Reset</title><style>body{margin:0;background:#0f131a;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;margin:24px;padding:32px;border:3px solid #62c9ff;border-radius:24px;background:#1b2438;text-align:center}h1{margin-top:0}p{color:#c9d3e0}</style></head><body><div class="box"><h1>Refreshing Family Quest…</h1><p id="msg">Removing the stuck app cache and loading v0.23.6.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/family-quest/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.includes('family-quest')).map(k=>caches.delete(k)))}sessionStorage.setItem('fq-reset-0236','done');document.getElementById('msg').textContent='Reset complete. Opening v0.23.6…';setTimeout(()=>location.replace('./app-0236.html?fresh=20260910-1632'),600)}catch(e){document.getElementById('msg').textContent='Reset hit an error. Tap refresh and try again.';console.error(e)}})();</script></body></html>
